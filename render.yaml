services:
  - type: web
    name: logistics-platform-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node ./node_modules/typescript/bin/tsc -p tsconfig.json
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
